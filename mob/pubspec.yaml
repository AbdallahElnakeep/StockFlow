name: stockflow_rep
description: StockFlow mobile app for distribution reps
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  connectivity_plus: ^6.0.3
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0
  get_it: ^7.7.0
  easy_localization: ^3.0.7
  shared_preferences: ^2.3.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.20.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
